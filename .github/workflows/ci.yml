name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all projects
        run: |
          pnpm exec tsc --project packages/core/tsconfig.json --noEmit
          pnpm exec tsc --project packages/ui/tsconfig.json --noEmit
          pnpm exec tsc --project apps/api/tsconfig.json --noEmit
          pnpm exec tsc --project apps/web/tsconfig.json --noEmit
          pnpm exec tsc --project apps/desktop/tsconfig.json --noEmit

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Core tests
        run: pnpm --filter @yaad/core test

      - name: Run UI tests
        run: pnpm --filter @yaad/ui test

      - name: Run API tests
        run: pnpm --filter @yaad/api test

  build:
    name: Web & API Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core & UI
        run: |
          pnpm --filter @yaad/core build
          pnpm --filter @yaad/ui build

      - name: Build Web App
        run: pnpm --filter @yaad/web build

      - name: Build API
        run: pnpm --filter @yaad/api build
